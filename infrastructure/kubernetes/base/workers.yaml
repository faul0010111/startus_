apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  namespace: stratus
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: incident-service } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: incident-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4050" }
    spec:
      serviceAccountName: stratus
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: incident-service
          image: ghcr.io/stratus/incident-service:latest
          envFrom: [{ configMapRef: { name: stratus-config } }]
          env:
            - name: INCIDENT_SERVICE_PORT
              value: "4050"
            - name: POSTGRES_URL
              valueFrom: { secretKeyRef: { name: stratus-postgres, key: url } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

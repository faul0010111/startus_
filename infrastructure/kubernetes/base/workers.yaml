# The five stream workers share one shape; only the image and port differ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-engine
  namespace: stratus
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: signal-engine } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: signal-engine }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4010" }
    spec:
      serviceAccountName: stratus
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: signal-engine
          image: ghcr.io/stratus/signal-engine:latest
          ports: [{ containerPort: 4010, name: http }]
          envFrom: [{ configMapRef: { name: stratus-config } }]
          env: [{ name: SIGNAL_ENGINE_PORT, value: "4010" }]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: signal-engine
  namespace: stratus
spec:
  selector: { app.kubernetes.io/name: signal-engine }
  ports: [{ port: 80, targetPort: 4010 }]
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratus
  namespace: stratus
automountServiceAccountToken: false
---
# Read-only access to cluster inventory for the Kubernetes collector.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stratus-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stratus-collector
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: stratus-collector }
subjects:
  - { kind: ServiceAccount, name: stratus, namespace: stratus }

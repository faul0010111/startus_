name: stratus

services:
  kafka:
    # bitnami/kafka:3.7 no longer exists: in August 2025 Bitnami moved every
    # versioned tag out of docker.io/bitnami into the frozen docker.io/bitnamilegacy
    # archive. This is the official Apache image, which keeps receiving patches.
    # Note the env prefix is KAFKA_* here, not KAFKA_CFG_*.
    image: apache/kafka:3.9.2
    container_name: stratus-kafka
    ports: ["19092:19092"]
    environment:
      # KRaft single-node: no ZooKeeper, fast enough to boot in CI.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: the internal topics cannot be replicated three ways.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Required by the Apache image when KAFKA_PROCESS_ROLES is set: the
      # entrypoint formats the storage directory with it on first boot.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    healthcheck:
      # The Apache image ships the CLI under /opt/kafka/bin and does not put it
      # on PATH, so the scripts have to be called with their full path.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: stratus-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: stratus
      POSTGRES_PASSWORD: stratus
      POSTGRES_DB: stratus
    volumes: ["stratus-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stratus-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: stratus-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["../../observability/opentelemetry/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: stratus-prometheus
    ports: ["9090:9090"]
    volumes:
      - "../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: stratus-grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: stratus
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "../../observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on: [prometheus]

volumes:
  stratus-pgdata:

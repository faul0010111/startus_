global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: stratus

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: stratus-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4000
          - host.docker.internal:4010
          - host.docker.internal:4020
          - host.docker.internal:4030
          - host.docker.internal:4040
          - host.docker.internal:4050
        labels: { environment: local }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

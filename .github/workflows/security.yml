name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

  iac:
    name: Infrastructure scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned by commit SHA: every trivy-action tag from 0.0.1 to 0.34.2 was
      # rewritten during the March 2026 supply-chain compromise and later
      # removed, which is why @0.24.0 no longer resolves. Tags now carry a `v`
      # prefix; SHA pinning is the post-incident recommendation.
      #
      # Two steps on purpose. With `format: sarif` the action unsets
      # TRIVY_SEVERITY ("Building SARIF report with all severities"), so a
      # single step would silently ignore `severity:` and fail the build on
      # MEDIUM/LOW findings. The gate below therefore runs in table format,
      # where the severity filter is honoured, and the SARIF is produced
      # separately with every severity so Code Scanning keeps full visibility.
      - name: Trivy infrastructure gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Trivy infrastructure report (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: config
          scan-ref: infrastructure
          exit-code: "0"
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
